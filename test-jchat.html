<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Prueba J-Chat</title></head>
<body style="background:#111;color:#eee;font-family:monospace">
<h3>Prueba automática del servidor de J-Chat</h3>
<pre id="out">Ejecutando…</pre>
<script>
const KEY = "AIzaSyA0zBRrzn0uuv7IhryoUm1P1TIyLYpOcpY";
const DB = "https://jchat-johan-default-rtdb.firebaseio.com";
const out = document.getElementById('out');
out.textContent = "";
function log(m) { out.textContent += m + "\n"; }
async function call(method, url, body, token) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url + (token ? "?auth=" + token : ""), opt);
  let j = null;
  try { j = await r.json(); } catch (e) {}
  return [r.status, j];
}
async function cuenta(email, pw) {
  let [st, j] = await call("POST", "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + KEY, { email, password: pw, returnSecureToken: true });
  if (st !== 200) {
    [st, j] = await call("POST", "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + KEY, { email, password: pw, returnSecureToken: true });
  }
  if (st !== 200) throw new Error("cuenta " + email + " -> " + st + " " + JSON.stringify(j));
  return [j.localId, j.idToken];
}
(async () => {
  try {
    const [uidA, tokA] = await cuenta("prueba_musy@jchat.app", "PruebaMusy2026");
    const [uidB, tokB] = await cuenta("prueba_musy2@jchat.app", "PruebaMusy2026");
    log("OK cuentas de prueba creadas");
    let [st] = await call("PUT", DB + "/usernames/prueba_musy.json", uidA, tokA);
    if (st !== 200) throw new Error("reclamo A -> " + st);
    [st] = await call("PUT", DB + "/usernames/prueba_musy2.json", uidB, tokB);
    if (st !== 200) throw new Error("reclamo B -> " + st);
    [st] = await call("PUT", DB + "/users/" + uidA + ".json", { username: "prueba_musy" }, tokA);
    if (st !== 200) throw new Error("perfil A -> " + st);
    log("OK registro con @usuario único");
    [st] = await call("PUT", DB + "/usernames/prueba_musy.json", uidB, tokB);
    if (st === 200) throw new Error("un nombre tomado pudo reclamarse dos veces");
    log("OK nombre duplicado rechazado (" + st + ")");
    let dir;
    [st, dir] = await call("GET", DB + "/usernames.json", undefined, tokA);
    if (st !== 200 || !dir || !("prueba_musy2" in dir)) throw new Error("directorio -> " + st);
    log("OK buscador por @usuario");
    const cid = uidA < uidB ? uidA + "_" + uidB : uidB + "_" + uidA;
    [st] = await call("POST", DB + "/chats/" + cid + ".json", { from: uidA, text: "hola de prueba", ts: 1762496400000 }, tokA);
    if (st !== 200) throw new Error("envio -> " + st);
    let chat;
    [st, chat] = await call("GET", DB + "/chats/" + cid + ".json", undefined, tokB);
    const vals = chat ? Object.values(chat) : [];
    if (st !== 200 || !vals.length || vals[0].text !== "hola de prueba") throw new Error("recepcion -> " + st + " " + JSON.stringify(chat));
    log("OK envío y recepción de mensajes");
    [st] = await call("PATCH", DB + "/inbox/" + uidA + "/" + cid + ".json", { withUid: uidB, withName: "prueba_musy2", lastText: "hola de prueba", lastTs: 1762496400000 }, tokA);
    if (st !== 200) throw new Error("inbox A -> " + st);
    [st] = await call("PATCH", DB + "/inbox/" + uidB + "/" + cid + ".json", { withUid: uidA, withName: "prueba_musy", lastText: "hola de prueba", lastTs: 1762496400000 }, tokA);
    if (st !== 200) throw new Error("inbox B -> " + st);
    log("OK bandejas de chats");
    const [uidC, tokC] = await cuenta("prueba_musy3@jchat.app", "PruebaMusy2026");
    [st] = await call("GET", DB + "/chats/" + cid + ".json", undefined, tokC);
    if (st === 200) throw new Error("un tercero pudo leer el chat ajeno");
    [st] = await call("GET", DB + "/chats/" + cid + ".json");
    if (st === 200) throw new Error("un anónimo pudo leer el chat");
    log("OK privacidad (terceros y anónimos fuera)");
    await call("DELETE", DB + "/chats/" + cid + ".json", undefined, tokA);
    await call("DELETE", DB + "/inbox/" + uidA + "/" + cid + ".json", undefined, tokA);
    await call("DELETE", DB + "/inbox/" + uidB + "/" + cid + ".json", undefined, tokB);
    await call("DELETE", DB + "/users/" + uidA + ".json", undefined, tokA);
    await call("DELETE", DB + "/users/" + uidB + ".json", undefined, tokB);
    for (const t of [tokA, tokB, tokC]) {
      await call("POST", "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=" + KEY, { idToken: t });
    }
    log("OK limpieza (cuentas y datos de prueba borrados)");
    log("RESULTADO: TODO OK");
  } catch (e) {
    log("FALLO: " + e.message);
    log("RESULTADO: CON FALLOS");
  }
})();
</script>
</body></html>
